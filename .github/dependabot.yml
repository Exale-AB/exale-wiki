version: 2
updates:
  # Python deps for the uv workspace (root pyproject + uv.lock cover packages/*).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # GitHub Actions used by our workflows (ci, secret-scan).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
