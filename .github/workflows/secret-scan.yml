# Secret scanning with gitleaks. This repo's engine runs inside customer
# environments and its config carries API keys; a leaked key in history is a
# customer incident, not a chore.
#
# We run the gitleaks CLI directly via its official container rather than
# gitleaks/gitleaks-action@v2, which requires a paid GITLEAKS_LICENSE secret for
# organization-owned repos. The CLI is free and does the same scan.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose --exit-code=1
