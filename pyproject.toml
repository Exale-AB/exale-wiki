# Exale Wiki — uv workspace root.
#
# This root is a *virtual* project (not built or installed). It owns the shared
# tool configuration and the dev dependency set; the real code lives in the
# workspace members under packages/*.
#
# Extracted from the Exale platform monorepo. Holds the Self-Improving Knowledge
# Wiki: the pure-Python engine plus its logging and validation helpers.

[project]
name = "exale-wiki-workspace"
version = "0"
description = "Exale Self-Improving Knowledge Wiki (workspace root)."
# Pinned to 3.11 to match the Hermes runtime: thin skill bundles import these
# packages inside Hermes' Python 3.11 interpreter.
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
wiki-engine = { workspace = true }
wiki-utils = { workspace = true }
wiki-validation = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    # ruff and pyright are pinned exactly: their lint/format/type output changes
    # between releases, so a loose floor lets a from-scratch `uv sync` pull a
    # stricter version and surface new findings. Bump these deliberately.
    "ruff==0.16.1",
    "pyright==1.1.411",
    "types-pyyaml>=6.0.12.20260724",  # type stubs for PyYAML (pyright)
    # Members are installed editable into the shared venv so tests and
    # coverage see them by their import names. wiki-engine[llm] pulls openai so
    # the model-backed judgment path type-checks and is importable in dev.
    "wiki-engine[llm,extraction]",
    "wiki-utils",
    "wiki-validation",
]

# --- Lint & format -----------------------------------------------------------
[tool.ruff]
line-length = 100
# ruff 0.16 began formatting code blocks inside markdown. This repo's markdown
# is prose and illustrative snippets — design notes quote code from other repos
# and from the papers they port from — so formatting them is churn, not hygiene.
extend-exclude = ["*.md"]
target-version = "py311"
src = ["packages"]

[tool.ruff.lint]
# A sensible, not-overbearing default set: pycodestyle, pyflakes, isort,
# pyupgrade, bugbear, comprehensions, simplify.
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["wiki_engine", "wiki_utils", "wiki_validation"]

# --- Type checking -----------------------------------------------------------
[tool.pyright]
include = ["packages"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

# --- Tests -------------------------------------------------------------------
[tool.pytest.ini_options]
# `tests/` holds the repo-level docs harness; package tests live beside their
# package under packages/*/tests/.
testpaths = ["packages", "tests"]
addopts = "--cov --cov-report=term-missing --cov-report=xml --cov-config=pyproject.toml"
markers = [
    "unit: pure-Python unit tests with no external dependencies",
    "integration: drives real Hermes/Docker; excluded from the per-push unit run",
]

# --- Coverage: the 80% gate on packages/ -------------------------------------
[tool.coverage.run]
branch = true
source_pkgs = ["wiki_engine", "wiki_utils", "wiki_validation"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
