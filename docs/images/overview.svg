<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 704" width="1200" height="704" role="img" aria-labelledby="t d">
  <title id="t">Exale Wiki overview</title>
  <desc id="d">Messages, files and URLs are ingested into a git-versioned markdown wiki with a rulebook, a knowledge graph and a vector index. An agent queries the wiki and receives raw context with citations. Lint continuously checks the wiki for contradictions, orphans and stale sources.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#0F5F59"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#8A6A2F"/>
    </marker>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.6" fill="#1F2A37" opacity="0.07"/>
    </pattern>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .ink  { fill: #1F2A37; }
      .soft { fill: #4B5563; }
      .teal { fill: #0F5F59; }
      .gold { fill: #8A6A2F; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .h { font-size: 16px; font-weight: 700; }
      .b { font-size: 13px; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="704" rx="20" fill="#FBF7F0"/>
  <rect width="1200" height="704" rx="20" fill="url(#grain)"/>

  <!-- heading -->
  <text x="40" y="58" class="sans ink" font-size="34" font-weight="800">Exale Wiki</text>
  <text x="40" y="90" class="sans soft" font-size="17">A self-improving knowledge base your AI agent can remember with.</text>

  <!-- column labels -->
  <text x="40" y="140" class="sans eyebrow gold">SOURCES</text>
  <text x="340" y="140" class="sans eyebrow teal">THE WIKI</text>
  <text x="950" y="140" class="sans eyebrow gold">YOUR AGENT</text>

  <!-- sources -->
  <g class="sans">
    <rect x="40" y="150" width="190" height="84" rx="12" fill="#FFFFFF" stroke="#D9CFBD" stroke-width="1.5"/>
    <text x="58" y="184" class="ink h">Messages</text>
    <text x="58" y="208" class="soft b">chat, email, notes</text>

    <rect x="40" y="250" width="190" height="84" rx="12" fill="#FFFFFF" stroke="#D9CFBD" stroke-width="1.5"/>
    <text x="58" y="284" class="ink h">Files</text>
    <text x="58" y="308" class="soft b">docs, transcripts, exports</text>

    <rect x="40" y="350" width="190" height="84" rx="12" fill="#FFFFFF" stroke="#D9CFBD" stroke-width="1.5"/>
    <text x="58" y="384" class="ink h">URLs</text>
    <text x="58" y="408" class="soft b">web pages and articles</text>
  </g>

  <!-- ingest arrow -->
  <line x1="232" y1="292" x2="336" y2="292" stroke="#0F5F59" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="247" y="280" width="76" height="24" rx="12" fill="#0F5F59"/>
  <text x="285" y="297" class="sans" font-size="12" font-weight="700" letter-spacing="1.4" fill="#FFFFFF" text-anchor="middle">INGEST</text>
  <g class="sans soft" font-size="12" text-anchor="middle">
    <text x="285" y="326">summarise,</text>
    <text x="285" y="342">extract facts,</text>
    <text x="285" y="358">cite the source</text>
  </g>

  <!-- the wiki -->
  <rect x="340" y="150" width="500" height="320" rx="16" fill="#FFFFFF" stroke="#0F5F59" stroke-width="2"/>
  <text x="358" y="178" class="sans soft" font-size="13">A git repo of plain markdown you can read, grep and diff</text>

  <g class="sans">
    <rect x="354" y="196" width="148" height="140" rx="10" fill="#EEF6F4" stroke="#BCDAD5"/>
    <text x="368" y="224" class="mono teal" font-size="16" font-weight="700">raw/</text>
    <text x="368" y="250" class="ink b">Verbatim sources,</text>
    <text x="368" y="268" class="ink b">kept as they came</text>
    <text x="368" y="296" class="soft" font-size="12">+ manifest.jsonl</text>

    <rect x="516" y="196" width="148" height="140" rx="10" fill="#EEF6F4" stroke="#BCDAD5"/>
    <text x="530" y="224" class="mono teal" font-size="16" font-weight="700">wiki/</text>
    <text x="530" y="250" class="ink b">One page per topic,</text>
    <text x="530" y="268" class="ink b">a section per source</text>
    <text x="530" y="296" class="soft" font-size="12">[[wikilinks]] between</text>

    <rect x="678" y="196" width="148" height="140" rx="10" fill="#FBF1DC" stroke="#E6CF9C"/>
    <text x="692" y="224" class="mono gold" font-size="16" font-weight="700">schema/</text>
    <text x="692" y="250" class="ink b">The rulebook:</text>
    <text x="692" y="268" class="ink b">allowed kinds, honesty</text>
    <text x="692" y="286" class="ink b">and off-limits rules</text>
  </g>

  <text x="358" y="358" class="sans soft" font-size="11" font-weight="700" letter-spacing="1.4">DERIVED, REBUILDABLE FROM THE MARKDOWN</text>
  <g class="sans">
    <rect x="354" y="368" width="236" height="84" rx="10" fill="#FFFFFF" stroke="#BCDAD5" stroke-dasharray="5 4"/>
    <text x="370" y="396" class="ink h">Knowledge graph</text>
    <text x="370" y="418" class="soft b">Entities and facts; spots</text>
    <text x="370" y="436" class="soft b">contradicting claims</text>

    <rect x="604" y="368" width="222" height="84" rx="10" fill="#FFFFFF" stroke="#BCDAD5" stroke-dasharray="5 4"/>
    <text x="620" y="396" class="ink h">Vector index</text>
    <text x="620" y="418" class="soft b">Optional semantic recall</text>
    <text x="620" y="436" class="soft b">via Postgres + pgvector</text>
  </g>

  <!-- query arrows -->
  <line x1="946" y1="226" x2="844" y2="226" stroke="#8A6A2F" stroke-width="2.5" marker-end="url(#ahg)"/>
  <text x="895" y="214" class="sans soft" font-size="12" text-anchor="middle">question</text>

  <line x1="844" y1="318" x2="946" y2="318" stroke="#0F5F59" stroke-width="2.5" marker-end="url(#ah)"/>
  <rect x="857" y="306" width="76" height="24" rx="12" fill="#0F5F59"/>
  <text x="895" y="323" class="sans" font-size="12" font-weight="700" letter-spacing="1.4" fill="#FFFFFF" text-anchor="middle">QUERY</text>
  <g class="sans soft" font-size="12" text-anchor="middle">
    <text x="895" y="348">structure + graph</text>
    <text x="895" y="364">+ vectors, fused</text>
    <text x="895" y="380">with RRF</text>
  </g>

  <!-- agent -->
  <rect x="950" y="150" width="210" height="320" rx="16" fill="#FFFFFF" stroke="#D9CFBD" stroke-width="1.5"/>
  <g class="sans">
    <text x="970" y="186" class="ink" font-size="18" font-weight="700">Any MCP client</text>
    <text x="970" y="216" class="soft b">Gets raw context with</text>
    <text x="970" y="234" class="soft b">citations, then writes</text>
    <text x="970" y="252" class="soft b">the final answer itself.</text>
    <line x1="970" y1="276" x2="1140" y2="276" stroke="#E7DFD0"/>
    <text x="970" y="304" class="gold" font-size="11" font-weight="700" letter-spacing="1.4">8 MCP TOOLS</text>
  </g>
  <g class="mono ink" font-size="12.5">
    <text x="970" y="332">wiki_query</text>
    <text x="970" y="352">wiki_context</text>
    <text x="970" y="372">wiki_ingest</text>
    <text x="970" y="392">wiki_lint</text>
    <text x="970" y="412">wiki_search</text>
    <text x="970" y="432" class="soft">+ 3 more</text>
  </g>

  <!-- lint loop -->
  <line x1="590" y1="474" x2="590" y2="512" stroke="#8A6A2F" stroke-width="2.5" marker-start="url(#ahg)" marker-end="url(#ahg)"/>
  <rect x="340" y="516" width="500" height="68" rx="14" fill="#FBF1DC" stroke="#E6CF9C" stroke-width="1.5"/>
  <rect x="356" y="536" width="60" height="26" rx="13" fill="#8A6A2F"/>
  <text x="386" y="554" class="sans" font-size="12" font-weight="700" letter-spacing="1.4" fill="#FFFFFF" text-anchor="middle">LINT</text>
  <g class="sans">
    <text x="432" y="540" class="ink" font-size="14" font-weight="700">The self-improving loop</text>
    <text x="432" y="559" class="ink b">Flags orphaned pages, contradictions and stale sources,</text>
    <text x="432" y="575" class="ink b">then suggests refinements to the schema.</text>
  </g>

  <!-- principles -->
  <g class="sans">
    <rect x="40" y="616" width="265" height="64" rx="12" fill="#FFFFFF" stroke="#D9CFBD"/>
    <text x="58" y="644" class="ink" font-size="15" font-weight="700">Plain markdown</text>
    <text x="58" y="664" class="soft b">Read it, grep it, git diff it.</text>

    <rect x="325" y="616" width="265" height="64" rx="12" fill="#FFFFFF" stroke="#D9CFBD"/>
    <text x="343" y="644" class="ink" font-size="15" font-weight="700">Every fact is cited</text>
    <text x="343" y="664" class="soft b">Each claim traces to a source.</text>

    <rect x="610" y="616" width="265" height="64" rx="12" fill="#FFFFFF" stroke="#D9CFBD"/>
    <text x="628" y="644" class="ink" font-size="15" font-weight="700">Bring your own model</text>
    <text x="628" y="664" class="soft b">LLM and embeddings are injected.</text>

    <rect x="895" y="616" width="265" height="64" rx="12" fill="#FFFFFF" stroke="#D9CFBD"/>
    <text x="913" y="644" class="ink" font-size="15" font-weight="700">Boring by design</text>
    <text x="913" y="664" class="soft b">Python + git; Postgres optional.</text>
  </g>
</svg>
