# wiki-engine — the Self-Improving Knowledge Wiki core (Architecture §3.1).
# Pure Python, no Hermes import. All real wiki logic (ingest/query/lint/schema/
# render) lands here in later phases (Roadmap P4).
[project]
name = "wiki-engine"
version = "0.0.0"
description = "Self-Improving Knowledge Wiki engine (pure-Python core)."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "psycopg[binary]>=3.1", "igraph>=0.11"]

# Optional: model-backed judgment (HermesSummarizer/HermesAnswerer) talks to the
# Hermes OpenAI-compatible proxy via the openai SDK. The core engine stays
# dependency-light; the MCP/seat installs `wiki-engine[llm]`.
[project.optional-dependencies]
llm = ["openai>=1.0"]
embed = ["fastembed>=0.3"]
extraction = ["spacy>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiki_engine"]
